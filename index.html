function connect(){let u=$('url').value.trim(),k=$('key').value.trim();if(!u||!k)return msg('Enter both Supabase values.');localStorage.setItem('lcmc_url',u);localStorage.setItem('lcmc_key',k);sb=supabase.createClient(u,k);$('setup').classList.add('hidden');$('auth').classList.remove('hidden')}
function loadConfig(){let u=localStorage.getItem('lcmc_url'),k=localStorage.getItem('lcmc_key');if(u&&k){$('url').value=u;$('key').value=k;connect()}}
async function signup(){let {error}=await sb.auth.signUp({email:$('email').value,password:$('pass').value});$('authmsg').textContent=error?error.message:'Account created. Check your email if confirmation is enabled, then sign in.'}async function login(){let {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('authmsg').textContent=error.message;start(data.user)}async function logout(){await sb.auth.signOut();location.reload()}async function start(u){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email;await refresh();view('dash')}
function view(id){['dash','patients','new','appts'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='dash')dashboard();if(id==='patients')patientList();if(id==='new')newForm();if(id==='appts')appointments()}
function formHtml(p={}){return `<div class='card'><div class='grid'><div><label>Patient ID</label><input id='pid' value='${esc(p.patient_code||'')}' readonly></div><div><label>Name *</label><input id='name' value='${esc(p.name||'')}'></div><div><label>Age</label><input id='age' type='number' value='${esc(p.age||'')}'></div><div><label>Sex</label><select id='sex'><option></option><option ${p.sex==='Male'?'selected':''}>Male</option><option ${p.sex==='Female'?'selected':''}>Female</option><option ${p.sex==='Other'?'selected':''}>Other</option></select></div><div><label>Phone</label><input id='phone' value='${esc(p.phone||'')}'></div><div><label>CNIC</label><input id='cnic' value='${esc(p.cnic||'')}'></div><div><label>Appointment Date</label><input id='date' type='date' value='${esc(p.appointment_date||today())}'></div><div><label>Appointment Time</label><input id='time' type='time' value='${esc(p.appointment_time||'')}'></div><div class='full'><label>Address</label><input id='address' value='${esc(p.address||'')}'></div><div class='full'><label>Chief Complaint</label><textarea id='complaint'>${esc(p.complaint||'')}</textarea></div><div class='full'><label>Diagnosis</label><textarea id='diagnosis'>${esc(p.diagnosis||'')}</textarea></div><div class='full'><label>Clinical Notes / Examination</label><textarea id='exam'>${esc(p.exam||'')}</textarea></div><div><label>Blood Pressure</label><input id='bp' value='${esc(p.bp||'')}'></div><div><label>Pulse</label><input id='pulse' value='${esc(p.pulse||'')}'></div><div><label>Temperature</label><input id='temperature' value='${esc(p.temperature||'')}'></div><div><label>Weight</label><input id='weight' value='${esc(p.weight||'')}'></div><div><label>Follow-up Date</label><input id='followup' type='date' value='${esc(p.followup_date||'')}'></div><div class='full'><label>Notes</label><textarea id='notes'>${esc(p.notes||'')}</textarea></div></div><p><button class='btn' onclick='save()'>Save Patient</button> <button class='btn secondary' onclick='view("patients")'>Cancel</button></p></div>`}
function newForm(){editing=null;$('new').innerHTML='<h2>New Patient</h2>'+formHtml();}async function save(){let p={name:$('name').value.trim(),age:$('age').value||null,sex:$('sex').value||null,phone:$('phone').value||null,cnic:$('cnic').value||null,address:$('address').value||null,appointment_date:$('date').value||null,appointment_time:$('time').value||null,complaint:$('complaint').value||null,diagnosis:$('diagnosis').value||null,exam:$('exam').value||null,bp:$('bp').value||null,pulse:$('pulse').value||null,temperature:$('temperature').value||null,weight:$('weight').value||null,followup_date:$('followup').value||null,notes:$('notes').value||null};if(!p.name)return alert('Patient name is required.');let r=editing?await sb.from('patients').update(p).eq('id',editing):await sb.from('patients').insert(p);if(r.error)return alert(r.error.message);alert('Patient saved.');view('patients')}
async function patientList(){let q=promptSearch();let qu=sb.from('patients').select('*').order('created_at',{ascending:false}).limit(1000);if(q)qu=qu.or(`name.ilike.%${q}%,phone.ilike.%${q}%,patient_code.ilike.%${q}%`);let {data,error}=await qu;if(error)return alert(error.message);patients=data||[];$('patients').innerHTML='<div class="top"><h2>Patients</h2><button class="btn" onclick="view(\'new\')">+ New Patient</button></div><div class="card"><div class="search"><input id="search" placeholder="Search name, phone or Patient ID..." value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')patientList()"><button class="btn secondary" onclick="patientList()">Search</button></div><div class="table"><table><tr><th>ID</th><th>Name</th><th>Age/Sex</th><th>Phone</th><th>Appointment</th><th>Diagnosis</th><th>Action</th></tr>'+patients.map(p=>`<tr><td>${esc(p.patient_code)}</td><td>${esc(p.name)}</td><td>${esc(p.age)} / ${esc(p.sex)}</td><td>${esc(p.phone)}</td><td>${esc(p.appointment_date)} ${esc(p.appointment_time)}</td><td>${esc(p.diagnosis)}</td><td><button class='btn secondary' onclick='edit("${p.id}")'>Edit</button></td></tr>`).join('')+'</table></div></div>'}
function promptSearch(){return $('search')?.value?.trim()||''}async function edit(id){let {data,error}=await sb.from('patients').select('*').eq('id',id).single();if(error)return alert(error.message);editing=id;$('new').innerHTML='<h2>Edit Patient</h2>'+formHtml(data);view('new')}
async function dashboard(){let pc=await sb.from('patients').select('*',{count:'exact',head:true}),td=await sb.from('patients').select('*',{count:'exact',head:true}).eq('appointment_date',today()),up=await sb.from('patients').select('*',{count:'exact',head:true}).gte('appointment_date',today()),fo=await sb.from('patients').select('*',{count:'exact',head:true}).eq('followup_date',today()),list=await sb.from('patients').select('*').eq('appointment_date',today()).order('appointment_time');$('dash').innerHTML=`<h2>Dashboard</h2><div class='stat'>Patients<b>${pc.count||0}</b></div><div class='stat'>Today's Visits<b>${td.count||0}</b></div><div class='stat'>Upcoming<b>${up.count||0}</b></div><div class='stat'>Follow-ups<b>${fo.count||0}</b></div><div class='card'><h3>Today's Appointments</h3>${(list.data||[]).map(p=>`<div style='padding:8px;border-bottom:1px solid #eee'><b>${esc(p.appointment_time||'')}</b> — ${esc(p.name)} (${esc(p.patient_code)})<br><span class='muted'>${esc(p.phone)} • ${esc(p.diagnosis)}</span></div>`).join('')||'<p class="muted">No appointments today.</p>'}</div>`}
async function appointments(){let r=await sb.from('patients').select('*').gte('appointment_date',today()).order('appointment_date').order('appointment_time');$('appts').innerHTML='<h2>Upcoming Appointments</h2><div class="card"><div class="table"><table><tr><th>Date</th><th>Time</th><th>Patient</th><th>Phone</th><th>Diagnosis</th></tr>'+(r.data||[]).map(p=>`<tr><td>${esc(p.appointment_date)}</td><td>${esc(p.appointment_time)}</td><td>${esc(p.name)}<br>${esc(p.patient_code)}</td><td>${esc(p.phone)}</td><td>${esc(p.diagnosis)}</td></tr>`).join('')+'</table></div></div>'}async function refresh(){await dashboard()}async function exportCSV(){let {data,error}=await sb.from('patients').select('*').limit(10000);if(error)return alert(error.message);let k=['patient_code','name','age','sex','phone','cnic','appointment_date','appointment_time','complaint','diagnosis','exam','bp','pulse','temperature','weight','followup_date','notes'];let csv=[k,...(data||[]).map(p=>k.map(x=>p[x]))].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='LifeCare_Patients_'+today()+'.csv';a.click()}
loadConfig();
</script></body></html>
